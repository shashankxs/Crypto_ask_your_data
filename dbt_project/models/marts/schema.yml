version: 2

models:
  - name: dim_coin
    description: One row per coin with its latest known attributes.
    columns:
      - name: coin_id
        tests:
          - not_null
          - unique

  - name: fct_coin_latest_snapshot
    description: Most recent market snapshot per coin (one row per coin_id).
    columns:
      - name: coin_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_coin')
                field: coin_id
      - name: symbol
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: market_cap_usd
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: volume_usd
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_coin_price_daily
    description: Daily price/volume history per coin with 7-day moving average and day-over-day return.
    columns:
      - name: coin_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_coin')
                field: coin_id
      - name: price_date
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: volume_usd
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - coin_id
              - price_date

  - name: fct_market_sentiment_daily
    description: >
      One row per calendar date joining aggregated market stats (from CoinGecko
      price history) with the Fear & Greed Index (from alternative.me) —
      a second, independently-sourced signal joined on date.
    columns:
      - name: date
        tests:
          - not_null
          - unique
      - name: fear_greed_value
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
