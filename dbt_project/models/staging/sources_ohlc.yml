version: 2

sources:
  - name: raw_ohlc
    description: Candlestick (OHLC) data from CoinGecko's free /coins/{id}/ohlc endpoint.
    schema: raw
    tables:
      - name: coin_ohlc
        description: >
          One row per coin per candle. CoinGecko auto-selects candle width by
          the requested day window; at our 90-day window this is ~4-day
          candles, not daily — see ingestion/ingest_coingecko_ohlc.py.
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: coin_id
            tests:
              - not_null
          - name: high
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
          - name: low
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
