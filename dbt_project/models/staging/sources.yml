version: 2

sources:
  - name: raw
    description: Landing tables written directly by ingestion/ingest_coingecko.py.
    schema: raw
    tables:
      - name: coin_market_snapshot
        description: One row per coin per ingestion run (point-in-time market snapshot).
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: coin_id
            tests:
              - not_null
          - name: current_price
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false

      - name: coin_price_history
        description: Daily price/volume/market-cap history per coin.
        columns:
          - name: coin_id
            tests:
              - not_null
          - name: price_usd
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
