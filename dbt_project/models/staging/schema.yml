version: 2

models:
  - name: stg_coin_snapshot
    description: One row per coin per ingestion run, latest market snapshot from CoinGecko.
    columns:
      - name: coin_id
        description: CoinGecko slug identifier for the coin (e.g. "bitcoin").
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null

  - name: stg_coin_price_history
    description: Daily historical price/volume/market-cap points per coin.
    columns:
      - name: coin_id
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null

  - name: stg_fear_greed
    description: Deduplicated daily Crypto Fear & Greed Index (alternative.me).
    columns:
      - name: index_date
        tests:
          - not_null
          - unique
      - name: fear_greed_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
